name: reservations-system
services:
  reservations-db:
    image: postgres:16-alpine
    container_name: postgres_db
    ports:
      - "5433:5432"       # local port:container port
    volumes:
      - db_reservation:/var/lib/postgresql/data
    environment:
        POSTGRES_USER: ${DB_USERNAME}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
        POSTGRES_DB: ${DB_NAME}  # Base de datos inicial
        POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"

    networks:
      - reservations-network

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  reservations-system:
      image: reservations-system:1.0
      build:
        context: ./
        dockerfile: Dockerfile
      container_name: backend_system
      ports:
        - "8087:8087"
      environment:
        - SPRING_DATASOURCE_URL=jdbc:postgresql://reservations-db:5432/${DB_NAME}
        - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
        - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
        - JWT_SECRET_KEY=${JWT_SECRET_KEY}
        - JWT_EXPIRATION=${JWT_EXPIRATION}
        - ADMIN_PASSWORD_ENV=${ADMIN_PASSWORD_ENV}
      depends_on:
        reservations-db:
          condition: service_healthy
      networks:
        - reservations-network
      restart: unless-stopped

    # --- FRONTEND (React + Nginx) ---
  frontend-client:
      build:
        context: ./frontend     # Carpeta donde está el React y su Dockerfile
        dockerfile: Dockerfile  # Nombre del archivo Docker dentro de esa carpeta
      container_name: frontend_client
      ports:
          - "5173:80"             # Entras por localhost:5173 -> Nginx responde en el 80
      depends_on:
        - reservations-system   # Espera a que el backend inicie (opcional)
      networks:
        - reservations-network
      restart: unless-stopped

networks:
  reservations-network:
    driver: bridge

volumes:
  db_reservation:
    driver: local